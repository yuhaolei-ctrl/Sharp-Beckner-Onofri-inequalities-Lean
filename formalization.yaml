version: "v0.4"

project:
  name: "Sharp Beckner–Onofri inequalities on the flat torus"
  description: >-
    A Lean formalization of the sharp periodic Beckner–Onofri inequality and its
    dual, the periodic logarithmic Hardy–Littlewood–Sobolev inequality, on the unit
    flat torus R^d/Z^d, following the manuscript of Yuhao Lei and Matthew Rosenzweig.
    The optimal additive defect C_d(A) in
    log ∫ e^{u - mean u} ≤ A ‖u‖²_{Ḣ^{d/2}} + C_d(A) equals the pressure of the
    attractive logarithmic gas at inverse temperature 1/(2 A c_d). For 1 ≤ d ≤ 10
    the sharp zero-defect coefficient is the concentration coefficient 1/(4 d c_d),
    with the conformal equality family on the circle and equality only for constants
    when 2 ≤ d ≤ 10. For d ≥ 12 it is the first-Fourier-shell coefficient
    1/(2 (2π)^d), with equality only for constants; just above the spectral threshold
    the global minimizers form one full d-mode translation orbit and the pressure
    detaches quadratically. In dimension eleven there is a first-order transition
    strictly before spectral instability, 17.715 < β_gm(11) < 20.630 < β_s(11), with
    coexisting uniform and nonuniform minimizers and corners in the pressure and in
    the defect.
  authors:
    - "Yuhao Lei"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Yuhao Lei"

