      The square-torus case d = 2 of Theorem 1.1. The manuscript cites it; the Lean
      development proves this case with the manuscript's common argument.
    author_endorsement: "not-contacted"
  - title: "The attractive log gas: stability, uniqueness, and propagation of chaos"
    authors:
      - "Antonin Chodron de Courcel"
      - "Matthew Rosenzweig"
      - "Sylvia Serfaty"
    type: "paper"
    id: "doi:10.1090/cams/55"
