      that Theorem 1.2 disproves for d = 11. Context only.
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    Challenge.lean restates, using only Mathlib, every assertion of Theorems 1.1, 1.2
    and 1.3 of the manuscript: the sharp inequalities in density and in potential
    form, their sharpness and equality cases, the pressure and defect formulas and
    thresholds, the dimension-eleven competitor, transition interval, coexistence,
    local stability and corners, and for d ≥ 12 the onset branch with its pressure and
    defect expansions. Rendering conventions: the negative Sobolev norm enters as
    spectralEnergy ρ = (2π)^d ‖ρ‖²_{Ḣ^{-d/2}} and c_d through the spectral threshold
    β_s(d) = (2π)^d/c_d; pressure and defect take values in the extended reals;
    inequalities for arbitrary densities use an extended entropy equal to ∞ when
    ρ log ρ is not integrable, while density equality cases assume finite entropy, as
    in the manuscript; equalities of functions hold almost everywhere; the corners of
    Theorem 1.2 are stated as finiteness near the threshold, non-differentiability, and
    the one-sided pressure derivatives 0 = P'_- < P'_+; local stability is a lower
    bound θ ∫ h² on the second derivative of the free energy along smooth mean-zero
    perturbations of the uniform density; the Euclidean profile of Theorem 1.2 uses
    C_11 = 122880/π^6, and eleven_profile_constant proves C_11 = Γ(11)/(π^{11/2}Γ(11/2)).
    The numbered results of the manuscript have counterparts in the library
    (BecknerOnofri/PaperResults.lean, CORRESPONDENCE.md), but only Theorems 1.1–1.3 are
    compared by Comparator. Not formalized: the counterexample of Remark 5.6, and the
    displayed cutoff rate inside the proof of Lemma 2.9, where the library proves the
    closure statement by form-norm convergence instead.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

