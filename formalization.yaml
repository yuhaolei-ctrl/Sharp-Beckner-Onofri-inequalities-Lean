related_formalizations: []

status:
  scope: >-
    Challenge.lean restates, using only Mathlib, every assertion of Theorems 1.1, 1.2
    and 1.3 of the manuscript: the sharp inequalities in density and in potential
    form, their sharpness and equality cases, the pressure and defect formulas and
    thresholds, the dimension-eleven competitor, transition interval, coexistence,
    local stability and corners, and for d ≥ 12 the onset branch with its pressure and
    defect expansions. Rendering conventions: the negative Sobolev norm enters as
    spectralEnergy ρ = (2π)^d ‖ρ‖²_{Ḣ^{-d/2}} and c_d through the spectral threshold
    β_s(d) = (2π)^d/c_d; pressure and defect take values in the extended reals;
    inequalities for arbitrary densities use an extended entropy equal to ∞ when
    ρ log ρ is not integrable, while density equality cases assume finite entropy, as
    in the manuscript; equalities of functions hold almost everywhere; the corners of
    Theorem 1.2 are stated as finiteness near the threshold, non-differentiability, and
    the one-sided pressure derivatives 0 = P'_- < P'_+; local stability is a lower
    bound θ ∫ h² on the second derivative of the free energy along smooth mean-zero
    perturbations of the uniform density. All 51 numbered results of the manuscript are
    proved in the library (CORRESPONDENCE.md), but only Theorems 1.1–1.3 are compared
    by Comparator. Not formalized: the counterexample of Remark 5.6, and the displayed
    cutoff rate inside the proof of Lemma 2.9, where the library proves the closure
    statement by form-norm convergence instead.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: []
      framework: "OpenAI Codex"
      tool_setup: >-
        Agent-written Lean development, generated arithmetic certificates re-checked by
        the Lean kernel through proved semantic bridges, and the migration to Lean 4.35
        and the module system. Model identifiers were not recorded.
      cost:
        wall_time: "several weeks (September–October 2026)"
        spend_usd: "not tracked"
        hardware: "local machine and GitHub-hosted runners"
      prompting_notes: >-
        The author supplied the manuscript and directed the formalization result by
        result.
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        Statement audit of the trusted surface against the manuscript, the Mathlib-only
        Challenge and its Solution bridge, migration fixes, and the Palomar layout.
      cost:
        wall_time: "part of October 2026"
        spend_usd: "subscription-based"
        hardware: "local machine, API-only for inference"
      prompting_notes: >-
        The author asked for a Palomar-ready repository following registered examples,
        with Comparator passing and the Challenge matching the manuscript's theorems.
  spend_usd: "not tracked"
  notes: >-
    The manuscript was written by its two authors. The Lean development was produced by
    AI agents under the direction of Yuhao Lei. No external computation is admitted as
    an axiom: every finite certificate is re-checked by the Lean kernel.

fidelity:
  divergences: >-
    Statements: see status.scope for the rendering conventions; none weakens a claim of
    Theorems 1.1–1.3. Proofs: in dimension 2 the finite scalar comparisons cover
    n = 1, 2, 3 and an analytic Gaussian estimate covers n ≥ 4 (the manuscript checks
    n ≤ 21 and estimates n ≥ 22); several low-dimensional certificates use the scale
    2^40 instead of 2^80; the theta integral J_10 is bounded with a rational Laplace
    majorant instead of the manuscript's quadrature grid. The library statements of
    three supporting results are weaker than printed, although the stronger forms are
    proved internally: Lemma 3.2 does not restate integrability of its integrand,
    Proposition 2.7 does not restate smoothness of the attaining potential, and
    Proposition 2.11 states the cosine mixture almost everywhere. Remark 5.6 and the
    displayed cutoff rate in the proof of Lemma 2.9 are not formalized.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    An agent-assisted audit (Claude Code) compared every definition reached by the
    Challenge, and the statements of all 51 numbered results, with the manuscript
    clause by clause, and checked for junk-value artefacts (a divergent tsum, toReal of
    infinity, sSup of an unbounded set, deriv of a non-differentiable function). No
    independent human review has been completed.

