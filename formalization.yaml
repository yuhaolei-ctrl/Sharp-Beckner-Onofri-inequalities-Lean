    an axiom: every finite certificate is re-checked by the Lean kernel.

fidelity:
  divergences: >-
    Statements: see status.scope for the rendering conventions; none weakens a claim of
    Theorems 1.1–1.3. Proofs (PROOF_AUDIT.md compares every proof with the paper's): the
    main proofs select symmetric optimizers by polarization on the potential side instead
    of Lemma 2.12's rearrangement, prove Proposition 3.7 without Lemmas 2.1 and 2.12, and
    obtain Proposition 5.23 from the full diagonal branch without classifying the other
    branches of Proposition 5.22; Lemma 5.13 for 3 ≤ n ≤ 50 computes the shell coefficients
    exactly below the truncation radius 3n + 10 instead of the manuscript's Q = 150, and
    uses the exact value for n = 2; the finite scalar checks of Propositions 3.1 and 4.6 use
    eq:finite-scalar-truncation with Q = 64 instead of Q = 80; Proposition 5.12(ii) for small means t ≤ 1/16 uses an
    analytic small-mean estimate instead of the origin jet and the Taylor-model cells below
    1/16, so Lemma 5.20 is formalized on [1/16, 0.99], where it is certified by first-order
    fixed-point Taylor models on 127 cells (the manuscript uses order-4 Taylor models on 78
    cells); Lemma 5.17 compares the barrier in the Bessel variable and checks the weight and
    entropy-tail bounds against truncated series by Bernstein coefficients; Lemma 3.6 is formalized at β = 2d,
    the case used in Proposition 3.7; in dimension 2 the finite scalar comparisons cover
    n = 1, 2, 3 and an analytic Gaussian estimate covers n ≥ 4; several low-dimensional
    certificates use the scale 2^40 instead of 2^80; J_10, J_11 and J_12 are bounded with
    rational Laplace majorants. The library statements of two supporting results are
    weaker than printed, although the stronger forms are proved internally: Proposition 2.7
    does not restate smoothness of the attaining potential, and Proposition 2.11 states
    the cosine mixture almost everywhere. Remark 5.6 and the displayed cutoff rate in the
    proof of Lemma 2.9 are not formalized.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    An agent-assisted audit (Claude Code) compared every definition reached by the
    Challenge, and the statements of the numbered results, with the manuscript
    clause by clause, and checked for junk-value artefacts (a divergent tsum, toReal of
    infinity, sSup of an unbounded set, deriv of a non-differentiable function). No
    independent human review has been completed.

