name: Verified con-ron certificate check
on:
  workflow_dispatch:
    inputs:
      certificate_release:
        description: Release containing the exact solution export
        required: true
        type: string
permissions:
  contents: read
jobs:
  con-ron:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download and validate the exact certificate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CERT_RELEASE: ${{ inputs.certificate_release }}
        run: |
          set -o pipefail
          mkdir -p external-check
          gh release download "$CERT_RELEASE" --pattern solution.ndjson.gz --pattern certificate-export.json --dir external-check
          python3 scripts/prepare_external_check.py | tee external-check/identity.log
          python3 scripts/audit_export_inventory.py external-check/solution.ndjson > external-check/solution-inventory.json
          cmp external-check/solution-inventory.json verification/solution-inventory.json
      - name: Build the unmodified Arena-pinned verified checker
        run: |
          set -o pipefail
          git clone https://github.com/leanprover/con-ron .tools/con-ron
          git -C .tools/con-ron checkout --detach 2e3486617cee878f796d8133c481e239696132fe
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 build --release --locked --manifest-path .tools/con-ron/Cargo.toml 2>&1 | tee external-check/build.log
          test -z "$(git -C .tools/con-ron diff --name-only)"
          sha256sum .tools/con-ron/target/release/con-ron > external-check/checker-binary.sha256
          .tools/con-ron/target/release/con-ron --help > external-check/checker-help.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('external-check/runtime-settings.json').write_text(json.dumps({
              'checker_revision': '2e3486617cee878f796d8133c481e239696132fe',
              'rust_toolchain': '1.90.0',
              'source_patch': None,
              'mode': 'verified',
              'num_threads': 4,
              'arguments': ['--verified', '--jobs=4', '--progress=10000'],
              'pins': 'checker-embedded defaults',
              'certificate_recompiled': False
          }, indent=2) + '\n')
          PY
      - name: Accept valid and reject damaged proof controls
        run: |
          python3 - <<'PY'
          import gzip, json, re, subprocess
          from pathlib import Path
          out = Path('external-check')
          binary = '.tools/con-ron/target/release/con-ron'
          results = []
          for name, expected in [('valid', 0), ('invalid', 1)]:
              path = out / (name + '.ndjson')
              path.write_bytes(gzip.decompress(Path('tests/kernel_controls/' + name + '.ndjson.gz').read_bytes()))
              run = subprocess.run([binary, '--verified', '--jobs=4', str(path)], capture_output=True, text=True)
              text = run.stdout + run.stderr
              results.append({'control': name, 'exit_code': run.returncode, 'output': text})
              (out / 'controls.json').write_text(json.dumps(results, indent=2) + '\n')
              print(name, run.returncode, text)
              assert run.returncode == expected
              if name == 'valid':
                  assert re.search(r'^con-ron: accepted [0-9]+ declarations \(--verified\)$', text, re.M)
          PY
      - name: Check every exported record in verified mode
        run: |
          set -o pipefail
          ulimit -c 0
          /usr/bin/time -v .tools/con-ron/target/release/con-ron --verified --jobs=4 --progress=10000 external-check/solution.ndjson 2>&1 | tee external-check/con-ron.log
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          text = Path('external-check/con-ron.log').read_text()
          accepted = re.search(r'^con-ron: accepted ([0-9]+) declarations \(--verified\)$', text, re.M)
          assert accepted
          inventory = json.loads(Path('external-check/solution-inventory.json').read_text())
          assert int(accepted[1]) == inventory['declaration_record_count']
          PY
      - name: Preserve verified-checker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: con-ron-evidence
          path: |
            external-check/*.log
            external-check/*.json
            external-check/*.txt
            external-check/*.sha256
