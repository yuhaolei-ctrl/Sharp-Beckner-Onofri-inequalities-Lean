name: Independent kernel certificate
on:
  workflow_dispatch:
    inputs:
      certificate_release:
        description: Release containing solution.ndjson.gz and certificate-export.json
        required: true
        type: string
      worker_threads:
        description: Independent checker worker threads
        required: true
        default: "2"
        type: choice
        options: ["2", "4"]
permissions:
  contents: read
jobs:
  nanoda:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download and validate the exact proof export
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CERT_RELEASE: ${{ inputs.certificate_release }}
          NANODA_THREADS: ${{ inputs.worker_threads }}
        run: |
          mkdir -p external-check
          gh release download "$CERT_RELEASE" --pattern solution.ndjson.gz --pattern certificate-export.json --dir external-check
          python3 scripts/prepare_external_check.py | tee external-check/identity.log
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("external-check/nanoda-config.json")
          settings = json.loads(p.read_text())
          workers = int(os.environ["NANODA_THREADS"])
          assert workers in (2, 4)
          settings["num_threads"] = workers
          p.write_text(json.dumps(settings, indent=2) + "\n")
          PY
      - name: Build pinned independent kernel
        run: |
          git clone https://github.com/ammkrn/nanoda_lib .tools/nanoda
          git -C .tools/nanoda checkout --detach 4c544ed4099c8227f07d5de77ad1e69fb0740a27
          python3 scripts/patch_nanoda_runtime.py .tools/nanoda
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 build --release --locked --manifest-path .tools/nanoda/Cargo.toml
          sha256sum .tools/nanoda/target/release/nanoda_bin > external-check/checker-binary.sha256
          git -C .tools/nanoda diff > external-check/checker.patch
      - name: Check all exported declarations and resolve all registered targets
        env:
          NANODA_TRACE_DIR: ${{ github.workspace }}/external-check
        run: |
          set -o pipefail
          ulimit -c 0
          (while sleep 60; do
            date -u
            for trace in external-check/*.trace; do
              test ! -f "$trace" || tail -n 1 "$trace"
            done
          done) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          /usr/bin/time -v .tools/nanoda/target/release/nanoda_bin external-check/nanoda-config.json < external-check/solution.ndjson 2>&1 | tee external-check/nanoda.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('external-check/nanoda.log').read_text()
          assert re.search(r'Checked [0-9]+ declarations with no errors', text)
          assert Path('external-check/checked-targets.txt').stat().st_size > 0
          PY
      - name: Preserve compact declaration traces
        if: always()
        run: |
          python3 - <<'PY'
          import gzip, json, shutil
          from pathlib import Path
          out = Path('external-check')
          for p in out.glob('*.trace'):
              with p.open('rb') as src, gzip.open(str(p) + '.gz', 'wb') as dst:
                  shutil.copyfileobj(src, dst)
          settings = json.loads((out / 'nanoda-config.json').read_text())
          (out / 'runtime-settings.json').write_text(json.dumps({
              'worker_stack_bytes': 1073741824,
              'num_threads': settings['num_threads'],
              'patch_scope': 'stack allocation and optional diagnostic name traces; logical checker unchanged'
          }, indent=2) + '\n')
          PY
      - name: Preserve independent checker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-kernel-evidence
          path: |
            external-check/*.log
            external-check/*.json
            external-check/*.txt
            external-check/*.sha256
            external-check/*.patch
            external-check/*.trace.gz
