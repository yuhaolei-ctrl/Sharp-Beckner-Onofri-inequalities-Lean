name: Independent kernel certificate
run-name: Nanoda certificate (${{ github.event_name }} at ${{ github.sha }})
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/independent-kernel.yml
      - scripts/run_nanoda.py
      - tests/test_nanoda_runner.py
  workflow_dispatch:
    inputs:
      certificate_release:
        description: Release containing solution.ndjson.gz and certificate-export.json
        required: true
        default: verified-20261005
        type: string
      worker_threads:
        description: Independent checker worker threads
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "4"]
      extra_swap_gb:
        description: Additional swap on the disposable GitHub runner
        required: true
        default: "8"
        type: choice
        options: ["0", "8"]
permissions:
  contents: read
jobs:
  nanoda:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test process supervision and failure receipts
        run: python3 -m unittest discover -s tests -p test_nanoda_runner.py
      - name: Download and validate the exact proof export
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CERT_RELEASE: ${{ inputs.certificate_release || 'verified-20261005' }}
          NANODA_THREADS: ${{ inputs.worker_threads || '1' }}
        run: |
          set -o pipefail
          mkdir -p external-check
          gh release download "$CERT_RELEASE" --pattern solution.ndjson.gz --pattern certificate-export.json --dir external-check
          python3 scripts/prepare_external_check.py | tee external-check/identity.log
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("external-check/nanoda-config.json")
          settings = json.loads(p.read_text())
          workers = int(os.environ["NANODA_THREADS"])
          assert workers in (1, 2, 4)
          settings["num_threads"] = workers
          p.write_text(json.dumps(settings, indent=2) + "\n")
          PY
      - name: Record host memory and optionally add swap
        env:
          EXTRA_SWAP_GB: ${{ inputs.extra_swap_gb || '8' }}
        run: |
          set -o pipefail
          python3 - <<'PYSETTINGS'
          import json, os
          from pathlib import Path
          size = int(os.environ['EXTRA_SWAP_GB'])
          assert size in (0, 8)
          Path('external-check/host-memory-settings.json').write_text(json.dumps({
              'additional_swap_bytes': size * 1024**3,
              'scope': 'disposable GitHub runner only; no proof or checker rule changes'
          }, indent=2) + '\n')
          PYSETTINGS
          if [ "$EXTRA_SWAP_GB" = "8" ]; then
            test "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -n 1)" -gt 9663676416
            sudo fallocate -l 8G "$RUNNER_TEMP/nanoda-extra.swap"
            sudo chmod 600 "$RUNNER_TEMP/nanoda-extra.swap"
            sudo mkswap "$RUNNER_TEMP/nanoda-extra.swap"
            sudo swapon "$RUNNER_TEMP/nanoda-extra.swap"
          fi
          free -h | tee external-check/host-memory.log
          swapon --show | tee -a external-check/host-memory.log
          cat /proc/meminfo >> external-check/host-memory.log
          df -h "$RUNNER_TEMP" >> external-check/host-memory.log
      - name: Build pinned independent kernel
        run: |
          git clone https://github.com/ammkrn/nanoda_lib .tools/nanoda
          git -C .tools/nanoda checkout --detach 4c544ed4099c8227f07d5de77ad1e69fb0740a27
          python3 scripts/patch_nanoda_runtime.py .tools/nanoda
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 build --release --locked --manifest-path .tools/nanoda/Cargo.toml
          sha256sum .tools/nanoda/target/release/nanoda_bin > external-check/checker-binary.sha256
          git -C .tools/nanoda diff > external-check/checker.patch
      - name: Accept valid and reject damaged proof controls
        run: |
          ulimit -c 0
          python3 - <<'PY'
          import gzip, hashlib, json, re, subprocess
          from pathlib import Path
          out = Path('external-check')
          fixtures = Path('tests/kernel_controls')
          manifest = json.loads((fixtures / 'manifest.json').read_text())
          settings = json.loads(Path('verification/nanoda-config.json').read_text())
          settings['num_threads'] = 1
          settings['unpermitted_axiom_hard_error'] = True
          config = out / 'controls-config.json'
          config.write_text(json.dumps(settings, indent=2) + '\n')
          results = []
          for name in ['valid', 'invalid']:
              archive = (fixtures / (name + '.ndjson.gz')).read_bytes()
              assert hashlib.sha256(archive).hexdigest() == manifest[name]['gzip_sha256']
              raw = gzip.decompress(archive)
              assert hashlib.sha256(raw).hexdigest() == manifest[name]['raw_sha256']
              run = subprocess.run(['.tools/nanoda/target/release/nanoda_bin', str(config)],
                                   input=raw, capture_output=True, timeout=120)
              text = (run.stdout + run.stderr).decode('utf-8', errors='replace')
              results.append({'control': name, 'exit_code': run.returncode, 'output': text})
              (out / 'controls.json').write_text(json.dumps(results, indent=2) + '\n')
              print(name, run.returncode, text)
              if name == 'valid':
                  assert run.returncode == 0 and re.search(r'^Checked [0-9]+ declarations with no errors$', text, re.M)
              else:
                  assert run.returncode != 0 and 'assertion failed: self.def_eq(u, v)' in text
          PY
      - name: Check all exported declarations and resolve all registered targets
        env:
          NANODA_TRACE_DIR: ${{ github.workspace }}/external-check
        run: |
          ulimit -c 0
          python3 scripts/run_nanoda.py --binary .tools/nanoda/target/release/nanoda_bin
      - name: Preserve compact declaration traces
        if: always()
        run: |
          python3 - <<'PY'
          import gzip, json, shutil
          from pathlib import Path
          out = Path('external-check')
          for p in out.glob('*.trace'):
              with p.open('rb') as src, gzip.open(str(p) + '.gz', 'wb') as dst:
                  shutil.copyfileobj(src, dst)
          settings = json.loads((out / 'nanoda-config.json').read_text())
          (out / 'runtime-settings.json').write_text(json.dumps({
              'worker_stack_bytes': 1073741824,
              'num_threads': settings['num_threads'],
              'patch_scope': 'worker stack allocation (also with one worker) and optional diagnostic name traces; logical checker unchanged'
          }, indent=2) + '\n')
          PY
      - name: Preserve independent checker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-kernel-evidence
          path: |
            external-check/*.log
            external-check/*.jsonl
            external-check/*.json
            external-check/*.txt
            external-check/*.sha256
            external-check/*.patch
            external-check/*.trace.gz
