name: Comparator certificate replay
on:
  workflow_dispatch:
    inputs:
      certificate_release:
        description: Release containing both exports and their provenance
        required: true
        type: string
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download and validate the exact exports
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CERT_RELEASE: ${{ inputs.certificate_release }}
        run: |
          set -o pipefail
          mkdir -p external-check
          gh release download "$CERT_RELEASE" --pattern solution.ndjson.gz --pattern certificate-export.json --pattern challenge.ndjson.gz --pattern challenge-export.json --dir external-check
          python3 scripts/prepare_external_check.py | tee external-check/identity.log
          python3 scripts/prepare_comparator_replay.py | tee external-check/comparator-identity.log
      - name: Install official pinned Lean and build replay driver
        run: |
          curl -fL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.32.0/lean-4.32.0-linux.tar.zst -o /tmp/lean.tar.zst
          echo 'fca846f3588724a38ad19ee40292c67cb7438d7555903372e3308eef795ba516  /tmp/lean.tar.zst' | sha256sum -c -
          mkdir -p .tools/lean
          tar --zstd -xf /tmp/lean.tar.zst --strip-components=1 -C .tools/lean
          export PATH="$PWD/.tools/lean/bin:$PATH"
          lake -d .tools/replay build replay-exports
          sha256sum .tools/replay/.lake/build/bin/replay-exports > external-check/comparator-binary.sha256
      - name: Match statements and replay the official kernel
        run: |
          set -o pipefail
          /usr/bin/time -v .tools/replay/.lake/build/bin/replay-exports verification/certified-comparator.json external-check/challenge.ndjson external-check/solution.ndjson 2>&1 | tee external-check/comparator.log
          python3 - <<'PY'
          from pathlib import Path
          text = Path('external-check/comparator.log').read_text()
          assert 'Comparator accepts all registered statements and reachable definitions.' in text
          assert 'Comparator accepts axiom dependencies.' in text
          assert 'Lean default kernel accepts the solution' in text
          assert 'Your solution is okay!' in text
          PY
      - name: Preserve comparator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: comparator-replay-evidence
          path: |
            external-check/*.log
            external-check/*.json
            external-check/*.sha256
