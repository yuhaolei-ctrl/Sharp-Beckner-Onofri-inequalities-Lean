name: Additional Lean4Lean certificate replay
on:
  workflow_dispatch:
    inputs:
      certificate_release:
        description: Release containing the exact solution export
        required: true
        type: string
permissions:
  contents: read
jobs:
  lean4lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download and validate the exact certificate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CERT_RELEASE: ${{ inputs.certificate_release }}
        run: |
          set -o pipefail
          mkdir -p external-check
          gh release download "$CERT_RELEASE" --pattern solution.ndjson.gz --pattern certificate-export.json --dir external-check
          python3 scripts/prepare_external_check.py | tee external-check/identity.log
      - name: Build the unmodified Arena-pinned Lean4Lean implementation
        run: |
          set -o pipefail
          curl -fL --retry 3 https://github.com/leanprover/lean4/releases/download/v4.33.0-rc2/lean-4.33.0-rc2-linux.tar.zst -o /tmp/lean4lean-runtime.tar.zst
          echo '48010c7d6264dc992574e9b0e09ece1f9c648e8f5106066b2cdb6834a6a60a6c  /tmp/lean4lean-runtime.tar.zst' | sha256sum -c -
          mkdir -p .tools/lean4lean-runtime
          tar --zstd -xf /tmp/lean4lean-runtime.tar.zst --strip-components=1 -C .tools/lean4lean-runtime
          export PATH="$PWD/.tools/lean4lean-runtime/bin:$PATH"
          git clone https://github.com/digama0/lean4lean .tools/lean4lean
          git -C .tools/lean4lean checkout --detach bce3448115f7819fc12d647fadd3bb090666637e
          lake -d .tools/lean4lean build lean4lean 2>&1 | tee external-check/build.log
          test -z "$(git -C .tools/lean4lean diff --name-only)"
          sha256sum .tools/lean4lean/.lake/build/bin/lean4lean > external-check/checker-binary.sha256
          cp .tools/lean4lean/lake-manifest.json external-check/checker-dependencies.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('external-check/runtime-settings.json').write_text(json.dumps({
              'checker_revision': 'bce3448115f7819fc12d647fadd3bb090666637e',
              'checker_runtime': 'Lean 4.33.0-rc2',
              'certificate_source_toolchain': 'Lean 4.32.0',
              'source_patch': None,
              'arguments': ['--import', '--verbose', '--config:whnf=10000000', '--config:whnfEager=100000000', '--config:lazyDelta=1000000'],
              'fuel_override_scope': 'larger finite reduction limits; checker rules unchanged',
              'implementation_relationship': 'Derived directly from the official C++ kernel; not independently designed',
              'certificate_recompiled': False
          }, indent=2) + '\n')
          PY
      - name: Accept valid and reject damaged proof controls
        run: |
          python3 - <<'PY'
          import gzip, json, re, subprocess
          from pathlib import Path
          out = Path('external-check')
          binary = '.tools/lean4lean/.lake/build/bin/lean4lean'
          results = []
          for name in ['valid', 'invalid']:
              path = out / (name + '.ndjson')
              path.write_bytes(gzip.decompress(Path('tests/kernel_controls/' + name + '.ndjson.gz').read_bytes()))
              run = subprocess.run([binary, '--import', '--config:whnf=10000000', '--config:whnfEager=100000000', '--config:lazyDelta=1000000', str(path)], capture_output=True, text=True)
              text = run.stdout + run.stderr
              results.append({'control': name, 'exit_code': run.returncode, 'output': text})
              (out / 'controls.json').write_text(json.dumps(results, indent=2) + '\n')
              print(name, run.returncode, text)
              if name == 'valid':
                  assert run.returncode == 0 and re.search(r'^checked [0-9]+ declarations$', text, re.M)
              else:
                  assert run.returncode == 1 and '(kernel) declaration type mismatch' in text
          PY
      - name: Replay the entire exact certificate with Lean4Lean
        run: |
          set -o pipefail
          ulimit -c 0
          (while sleep 60; do
            date -u
            tail -n 2 external-check/lean4lean.log || true
          done) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          /usr/bin/time -v .tools/lean4lean/.lake/build/bin/lean4lean --import --verbose --config:whnf=10000000 --config:whnfEager=100000000 --config:lazyDelta=1000000 external-check/solution.ndjson > external-check/lean4lean.log 2>&1
          tail -n 30 external-check/lean4lean.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('external-check/lean4lean.log').read_text()
          assert re.search(r'^checked [0-9]+ declarations$', text, re.M)
          PY
      - name: Preserve actual additional-checker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean4lean-evidence
          path: |
            external-check/*.log
            external-check/*.json
            external-check/*.sha256
